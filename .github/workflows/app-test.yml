# 답 흔들림 점검기(app/)의 판정 규칙 회귀 테스트를 푸시·PR마다 돌린다.
# 논문 답 240개 테스트(tests/paper240.test.js)는 답 파일이 저장소에 없어 여기서는 건너뛴다.
name: app-test

on:
  push:
    paths: ["app/**", "tests/**", "package.json", ".github/workflows/app-test.yml"]
  pull_request:
    paths: ["app/**", "tests/**", "package.json", ".github/workflows/app-test.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # 판정 규칙 테스트는 외부 패키지를 쓰지 않으므로 설치 없이 돌린다
      - run: npm test
